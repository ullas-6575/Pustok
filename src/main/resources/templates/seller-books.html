<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build your collection. | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='books')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">YOUR BOOKSHOP</span><h1>Build your collection.</h1><p>Add new titles, keep stock current and make your next sale.</p></div><div class="workspace-content seller-books"><section class="panel"><h2>Add a new book</h2><form th:action="@{/seller/books}" method="post"><label class="field-label">Book title<input name="title" placeholder="Title" required maxlength="255"></label><label class="field-label">Author<input name="author" placeholder="Author" required maxlength="255"></label><label class="field-label">Price (BDT)<input name="price" type="number" min="0.01" step="0.01" required placeholder="Price (BDT)"></label><label class="field-label">Available copies<input name="stock" type="number" min="0" required placeholder="Stock"></label><label class="field-label">Category<select name="categoryId" required><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><button>Add book</button></form></section><div class="section-heading"><h2>Your listings</h2><span th:text="${#lists.size(books) + ' books'}"></span></div><p class="empty-state" th:if="${#lists.isEmpty(books)}">Your shelves are waiting. Add your first book above.</p><article th:each="b : ${books}"><form th:action="@{/seller/books}" method="post"><input type="hidden" name="id" th:value="${b.id}"><label class="field-label">Book title<input th:value="${b.title}" name="title" placeholder="Title" required maxlength="255"></label><label class="field-label">Author<input th:value="${b.author}" name="author" placeholder="Author" required maxlength="255"></label><label class="field-label">Price (BDT)<input th:value="${b.price}" name="price" type="number" min="0.01" step="0.01" required placeholder="Price (BDT)"></label><label class="field-label">Available copies<input th:value="${b.stock}" name="stock" type="number" min="0" required placeholder="Stock"></label><label class="field-label">Category<select name="categoryId" required><option th:each="c : ${categories}" th:selected="${c.id == b.category.id}" th:value="${c.id}" th:text="${c.name}"></option></select></label><button>Save changes</button></form><form th:action="@{/seller/books/{id}/delete(id=${b.id})}" method="post"><button class="btn-danger">Delete book</button></form></article></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
