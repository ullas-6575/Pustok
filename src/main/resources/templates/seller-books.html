<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Pustok</title><link rel="stylesheet" href="/css/auth.css"></head><body><main style="background:white;padding:32px;width:min(1100px,100%)"><a href="/">Home</a> | <a href="/admin">Admin</a><h1>Manage books</h1><a href="/seller/orders">Seller Orders</a><form th:action="@{/seller/books}" method="post"><input name="title" placeholder="Title" required maxlength="255"><input name="author" placeholder="Author" required maxlength="255"><input name="price" type="number" min="0.01" step="0.01" required placeholder="Price (BDT)"><input name="stock" type="number" min="0" required placeholder="Stock"><select name="categoryId" required><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><button>Add book</button></form><article th:each="b : ${books}"><form th:action="@{/seller/books}" method="post"><input type="hidden" name="id" th:value="${b.id}"><input th:value="${b.title}" name="title" placeholder="Title" required maxlength="255"><input th:value="${b.author}" name="author" placeholder="Author" required maxlength="255"><input th:value="${b.price}" name="price" type="number" min="0.01" step="0.01" required placeholder="Price (BDT)"><input th:value="${b.stock}" name="stock" type="number" min="0" required placeholder="Stock"><select name="categoryId" required><option th:each="c : ${categories}" th:selected="${c.id == b.category.id}" th:value="${c.id}" th:text="${c.name}"></option></select><button>Save changes</button></form><form th:action="@{/seller/books/{id}/delete(id=${b.id})}" method="post"><button>Delete book</button></form></article></main></body></html>
