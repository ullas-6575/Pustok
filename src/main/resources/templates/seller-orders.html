<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller orders | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/cart.css"><link rel="stylesheet" href="/css/checkout.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="cart-page"><th:block th:replace="~{fragments/nav :: site-header(active='sellerorders')}"></th:block><main class="cart-shell"><div class="cart-heading"><div><h1>Seller orders</h1><p>Prepare and ship your part of each order.</p></div></div><p class="notice" role="alert" th:if="${message}" th:text="${message}"></p><section class="empty-state" th:if="${#lists.isEmpty(orders)}"><h2>No orders for your shop yet.</h2></section><article class="confirmation" th:each="o : ${orders}"><h2 th:text="${'Order ' + #strings.substring(o['id'].toString(),0,8)}"></h2><span class="status-badge" th:text="${o['status']}"></span><p th:text="${o['recipient_name']}"></p><p th:text="${o['phone']}"></p><p class="address" th:text="${o['address']}"></p><div class="checkout-line" th:each="item : ${shipmentItems[o['id']]}"><strong th:text="${item['title']}"></strong><span th:text="${'Qty: ' + item['quantity']}"></span></div><form th:if="${o['status'] == 'PLACED' or o['status'] == 'PROCESSING'}" th:action="@{/seller/orders/{id}/status(id=${o['id']})}" method="post"><input type="hidden" name="status" th:value="${o['status'] == 'PLACED' ? 'PROCESSING' : 'SHIPPED'}"><button class="btn btn-block place-order" type="submit" th:text="${o['status'] == 'PLACED' ? 'Start processing' : 'Mark as shipped'}"></button></form></article><div class="order-pagination"><a th:if="${page > 0}" th:href="@{/seller/orders(page=${page - 1})}">Previous</a><span th:text="${'Page ' + (page + 1)}"></span><a th:if="${#lists.size(orders) == 20}" th:href="@{/seller/orders(page=${page + 1})}">Next</a></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
