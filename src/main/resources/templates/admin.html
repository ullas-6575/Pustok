<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Pustok</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><main style="width:min(1100px,100%);background:white;padding:24px;border-radius:16px"><a th:href="@{/}">← Home</a><h1>Manage accounts</h1><p>Assign buyer or seller access. Seller profiles and application approval will be added separately.</p><div style="overflow:auto"><table style="width:100%;text-align:left;border-spacing:12px"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Update access</th></tr></thead><tbody><tr th:each="account : ${accounts}"><td th:text="${account.name}"></td><td th:text="${account.email}"></td><td th:text="${account.role}"></td><td><form th:if="${account.role != 'ADMIN'}" th:action="@{/admin/users/{id}/role(id=${account.id})}" method="post"><select name="role" aria-label="Account role"><option value="BUYER" th:selected="${account.role == 'BUYER'}">BUYER</option><option value="SELLER" th:selected="${account.role == 'SELLER'}">SELLER</option></select><button type="submit">Save role</button></form></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(accounts)}">No accounts on this page.</p><a th:if="${page > 0}" th:href="@{/admin(page=${page - 1})}">Previous</a> <a th:if="${#lists.size(accounts) == 50}" th:href="@{/admin(page=${page + 1})}">Next</a><form th:action="@{/signout}" method="post"><button type="submit">Sign out</button></form></main></body></html>
