<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People & permissions. | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='admin')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">ADMINISTRATION</span><h1>People & permissions.</h1><p>Manage accounts and review access across your marketplace.</p></div><div class="workspace-content admin"><div><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Update access</th></tr></thead><tbody><tr th:each="account : ${accounts}"><td th:text="${account.name}"></td><td th:text="${account.email}"></td><td th:text="${account.role}"></td><td><form th:if="${account.role != 'ADMIN'}" th:action="@{/admin/users/{id}/role(id=${account.id})}" method="post"><select name="role" aria-label="Account role"><option value="BUYER" th:selected="${account.role == 'BUYER'}">BUYER</option></select><button type="submit">Save role</button></form></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(accounts)}">No accounts on this page.</p><a th:if="${page > 0}" th:href="@{/admin(page=${page - 1})}">Previous</a> <a th:if="${#lists.size(accounts) == 50}" th:href="@{/admin(page=${page + 1})}">Next</a></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
