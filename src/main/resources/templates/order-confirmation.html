<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order details | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/cart.css"><link rel="stylesheet" href="/css/checkout.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="cart-page"><th:block th:replace="~{fragments/nav :: site-header(active='')}"></th:block><main class="cart-shell"><a class="back-link" th:href="${adminView == true ? '/admin/orders' : '/buyer/orders'}">All orders</a><section class="confirmation"><p class="notice" role="alert" th:if="${message}" th:text="${message}"></p><h1 th:text="${adminView == true ? 'Order details' : 'Your order'}"></h1><p th:if="${paymentNotice}" th:text="${paymentNotice}"></p><p class="order-id" th:text="${'Order: ' + order['id']}"></p><div class="confirmation-grid"><div><h2>Deliver to</h2><strong th:text="${order['recipient_name']}"></strong><p th:text="${order['phone']}"></p><p class="address" th:text="${order['address']}"></p></div><div><h2>Order status</h2><span class="status-badge" th:text="${order['status']}"></span><p th:if="${paymentLabel}" th:text="${paymentLabel}"></p><form th:if="${adminView != true and order['status'] == 'PLACED' and (payment == null or payment.status().name() == 'FAILED')}" th:action="@{/buyer/orders/{id}/pay(id=${order['id']})}" method="post"><label for="gateway">Payment method</label><select id="gateway" name="gateway"><option value="COD">Cash on delivery</option><option value="MOCK" th:if="${mockPaymentsEnabled}">Test card</option><option value="BKASH">bKash (sandbox)</option><option value="NAGAD">Nagad (sandbox)</option></select><label for="retryTestCard" th:if="${mockPaymentsEnabled}">Test card number (optional)</label><input id="retryTestCard" name="testCard" autocomplete="off" maxlength="50" placeholder="Optional" th:if="${mockPaymentsEnabled}"><input type="hidden" name="idempotencyKey" th:value="${payKey}"><button class="btn btn-secondary btn-sm" type="submit" th:text="${payment == null ? 'Pay now' : 'Retry payment'}">Retry payment</button></form><p class="availability-note">Order status moves from placed to processing, then shipped and delivered.</p><form th:if="${adminView != true and order['status'] == 'PLACED'}" th:action="@{/buyer/orders/{id}/cancel(id=${order['id']})}" method="post" onsubmit="return confirm('Cancel this order? Stock will be restored.')"><button class="btn btn-secondary btn-sm" type="submit">Cancel order</button></form><form th:if="${adminView == true and (order['status'] == 'PLACED' or order['status'] == 'PROCESSING' or order['status'] == 'SHIPPED')}" th:action="@{/admin/orders/{id}/status(id=${order['id']})}" method="post" th:onsubmit="${order['status'] == 'SHIPPED'} ? 'return confirm(`Mark this order as delivered? This cannot be undone.`)' : ''"><label for="status">Next status</label><select id="status" name="status"><option th:if="${order['status'] == 'PLACED'}" value="PROCESSING">Processing</option><option th:if="${order['status'] == 'PROCESSING'}" value="SHIPPED">Shipped</option><option th:if="${order['status'] == 'SHIPPED'}" value="DELIVERED">Delivered</option></select><button class="btn btn-secondary btn-sm" type="submit" th:aria-label="${'Update status for order ' + order['id']}">Update status</button></form></div></div><div class="checkout-line" th:each="item : ${items}"><div><strong th:text="${item['title']}"></strong><small th:text="${'Quantity: ' + item['quantity']}"></small><small th:text="${'Shipment: ' + #strings.capitalize(#strings.toLowerCase(item['shipment_status']))}"></small><form th:if="${adminView == true and (item['shipment_status'] == 'PLACED' or item['shipment_status'] == 'PROCESSING' or item['shipment_status'] == 'SHIPPED')}" th:action="@{/admin/orders/{id}/shipments/{seller}/status(id=${order['id']},seller=${item['seller_id']})}" method="post" th:onsubmit="${item['shipment_status'] == 'SHIPPED'} ? 'return confirm(`Mark this shipment as delivered? This cannot be undone.`)' : ''"><input type="hidden" name="status" th:value="${item['shipment_status'] == 'PLACED' ? 'PROCESSING' : (item['shipment_status'] == 'PROCESSING' ? 'SHIPPED' : 'DELIVERED')}"><button class="btn btn-secondary btn-sm" type="submit" th:aria-label="${'Update shipment status for ' + item['title'] + ' (seller ' + item['seller_id'] + ')'}">Update shipment status</button></form></div><span th:text="${'BDT ' + item['subtotal']}"></span></div><div class="summary-total"><span>Total</span><strong th:text="${'BDT ' + order['total']}"></strong></div><a class="btn btn-block" href="/">Continue browsing</a></section></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
