<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/cart.css"><link rel="stylesheet" href="/css/checkout.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="cart-page"><th:block th:replace="~{fragments/nav :: site-header(active='')}"></th:block><main class="cart-shell"><a class="back-link" th:href="${adminView == true ? '/admin/orders' : '/buyer/orders'}">&#8592; All orders</a><section class="confirmation"><p class="notice" role="alert" th:if="${message}" th:text="${message}"></p><span class="eyebrow">YOUR NEXT CHAPTER IS ON ITS WAY</span><h1 th:text="${adminView == true ? 'Order details' : 'Your order'}"></h1><p>Payment is due on delivery. Follow your order status below.</p><p class="order-id" th:text="${'Order: ' + order['id']}"></p><div class="confirmation-grid"><div><h2>Deliver to</h2><strong th:text="${order['recipient_name']}"></strong><p th:text="${order['phone']}"></p><p class="address" th:text="${order['address']}"></p></div><div><h2>Order status</h2><span class="status-badge" th:text="${order['status']}"></span><p>Payment: Cash on Delivery</p><p class="availability-note">Placed &#8594; Processing &#8594; Shipped &#8594; Delivered</p><form th:if="${adminView != true and order['status'] == 'PLACED'}" th:action="@{/buyer/orders/{id}/cancel(id=${order['id']})}" method="post"><button class="btn btn-secondary btn-sm" type="submit">Cancel order</button></form><form th:if="${adminView == true and order['status'] != 'DELIVERED'}" th:action="@{/admin/orders/{id}/status(id=${order['id']})}" method="post"><label for="status">Next status</label><select id="status" name="status"><option th:if="${order['status'] == 'PLACED'}" value="PROCESSING">Processing</option><option th:if="${order['status'] == 'PROCESSING'}" value="SHIPPED">Shipped</option><option th:if="${order['status'] == 'SHIPPED'}" value="DELIVERED">Delivered</option></select><button class="btn btn-secondary btn-sm">Update status</button></form></div></div><div class="checkout-line" th:each="item : ${items}"><div><strong th:text="${item['title']}"></strong><small th:text="${'Quantity: ' + item['quantity']}"></small><small th:text="${'Shipment: ' + item['shipment_status']}"></small><form th:if="${adminView == true and item['shipment_status'] != 'DELIVERED'}" th:action="@{/admin/orders/{id}/shipments/{seller}/status(id=${order['id']},seller=${item['seller_id']})}" method="post"><input type="hidden" name="status" th:value="${item['shipment_status'] == 'PLACED' ? 'PROCESSING' : (item['shipment_status'] == 'PROCESSING' ? 'SHIPPED' : 'DELIVERED')}"><button class="btn btn-secondary btn-sm">Update shipment status</button></form></div><span th:text="${'BDT ' + item['subtotal']}"></span></div><div class="summary-total"><span>Total</span><strong th:text="${'BDT ' + order['total']}"></strong></div><a class="btn btn-block" href="/">Keep exploring <span aria-hidden="true">&#8599;</span></a></section></main></body></html>
