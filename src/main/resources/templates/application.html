<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Pustok</title><link rel="stylesheet" href="/css/auth.css"></head><body><main style="background:white;padding:32px;width:min(1100px,100%)"><a href="/">Home</a> | <a href="/admin">Admin</a><h1>Become a Seller</h1><p th:if="${profile != null}" th:text="${'Application status: ' + profile.status}"></p><form th:if="${profile == null or profile.status == 'REJECTED'}" th:action="@{/buyer/seller-application}" method="post"><label>Shop name<input name="shopName" required maxlength="150"></label><label>Phone<input name="phone" required maxlength="30"></label><label>Address<textarea name="address" required maxlength="500"></textarea></label><button>Submit application</button></form></main></body></html>
