<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your shop starts here. | Pustok</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><header class="topbar"><a class="logo" href="/"><span class="logo-mark">p</span> pustok</a><nav aria-label="Account navigation"><a href="/">Discover</a><a sec:authorize="hasAnyRole('BUYER','SELLER')" href="/buyer/orders">My orders</a><a sec:authorize="hasRole('SELLER')" href="/seller/books">My books</a><a sec:authorize="hasRole('SELLER')" href="/seller/orders">Seller orders</a><a sec:authorize="hasRole('ADMIN')" href="/admin">Accounts</a><a sec:authorize="hasRole('ADMIN')" href="/admin/applications">Applications</a><a sec:authorize="hasRole('ADMIN')" href="/admin/categories">Categories</a><a sec:authorize="hasRole('ADMIN')" href="/admin/orders">Orders</a></nav><form th:action="@{/signout}" method="post"><button class="signout">Sign out</button></form></header><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">GROW WITH PUSTOK</span><h1>Your shop starts here.</h1><p>Share a few details. Once approved, you can start listing your books.</p></div><div class="workspace-content application"><section class="panel application-panel"><p th:if="${profile != null}" th:text="${'Application status: ' + profile.status}"></p><form th:if="${profile == null or profile.status == 'REJECTED'}" th:action="@{/buyer/seller-application}" method="post"><label>Shop name<input name="shopName" required maxlength="150"></label><label>Phone<input name="phone" required maxlength="30"></label><label>Address<textarea name="address" required maxlength="500"></textarea></label><button>Submit application</button></form></section></div></main><footer><a class="logo" href="/">pustok</a><small>Made for the love of a good story.</small><small>2026 Pustok Books</small></footer></body></html>
