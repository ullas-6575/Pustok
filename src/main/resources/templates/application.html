<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a seller | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='apply')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><h1>Become a seller</h1><p>Share your shop details. Once approved, you can start listing books.</p></div><p class="notice" th:if="${message}" th:classappend="${error != null ? ' error' : ''}" th:attr="role=${error != null ? 'alert' : 'status'}" th:text="${message}"></p><div class="workspace-content application"><section class="panel application-panel"><h2>Your application</h2><p th:if="${profile != null}" th:text="${'Application status: ' + #strings.capitalize(#strings.toLowerCase(profile.status))}"></p><form th:if="${profile == null or profile.status == 'REJECTED'}" th:action="@{/buyer/seller-application}" method="post"><label class="field-label">Shop name<input name="shopName" required maxlength="150"></label><label class="field-label">Phone<input name="phone" required maxlength="30"></label><label class="field-label">Address<textarea name="address" required maxlength="500"></textarea></label><button>Submit application</button></form></section></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
