<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your shop starts here. | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='apply')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">GROW WITH PUSTOK</span><h1>Your shop starts here.</h1><p>Share a few details. Once approved, you can start listing your books.</p></div><div class="workspace-content application"><section class="panel application-panel"><p th:if="${profile != null}" th:text="${'Application status: ' + profile.status}"></p><form th:if="${profile == null or profile.status == 'REJECTED'}" th:action="@{/buyer/seller-application}" method="post"><label>Shop name<input name="shopName" required maxlength="150"></label><label>Phone<input name="phone" required maxlength="30"></label><label>Address<textarea name="address" required maxlength="500"></textarea></label><button>Submit application</button></form></section></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
