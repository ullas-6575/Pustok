<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller applications | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='applications')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><h1>Seller applications</h1><p>Review shop details, then approve or reject each pending application.</p></div><p class="notice" th:if="${message}" th:classappend="${error != null ? ' error' : ''}" th:attr="role=${error != null ? 'alert' : 'status'}" th:text="${message}"></p><div class="workspace-content applications"><p class="empty-state" th:if="${#lists.isEmpty(profiles)}">No seller applications yet.</p><article th:each="p : ${profiles}"><h2 th:text="${p.shopName}"></h2><p th:text="${p.phone}"></p><p th:text="${p.address}"></p><p th:text="${#strings.capitalize(#strings.toLowerCase(p.status))}"></p><form th:if="${p.status == 'PENDING'}" th:action="@{/admin/applications/{id}(id=${p.id})}" method="post"><button name="approve" value="true" th:aria-label="${'Approve ' + p.shopName}" onclick="return confirm('Approve this application? The applicant will become a seller.');">Approve</button><button class="btn-secondary" name="approve" value="false" th:aria-label="${'Reject ' + p.shopName}" onclick="return confirm('Reject this seller application?');">Reject</button></form></article></div><nav class="pagination" th:if="${totalPages > 1}" aria-label="Application pages"><a th:if="${hasPrevious}" th:href="@{/admin/applications(page=${currentPage - 1})}">Newer</a><span th:text="${'Page ' + (currentPage + 1) + ' of ' + totalPages}">Page 1 of 1</span><a th:if="${hasNext}" th:href="@{/admin/applications(page=${currentPage + 1})}">Older</a></nav></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
