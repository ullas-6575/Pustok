<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Pustok</title><link rel="stylesheet" href="/css/auth.css"></head><body><main style="background:white;padding:32px;width:min(1100px,100%)"><a href="/">Home</a> | <a href="/admin">Admin</a><h1>Seller applications</h1><article th:each="p : ${profiles}"><h2 th:text="${p.shopName}"></h2><p th:text="${p.phone}"></p><p th:text="${p.address}"></p><p th:text="${p.status}"></p><form th:if="${p.status == 'PENDING'}" th:action="@{/admin/applications/{id}(id=${p.id})}" method="post"><button name="approve" value="true">Approve</button><button name="approve" value="false">Reject</button></form></article></main></body></html>
