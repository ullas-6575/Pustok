<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet your next sellers. | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='applications')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">SELLER COMMUNITY</span><h1>Meet your next sellers.</h1><p>Review shop details and approve applications with confidence.</p></div><div class="workspace-content applications"><p class="empty-state" th:if="${#lists.isEmpty(profiles)}">No seller applications yet.</p><article th:each="p : ${profiles}"><h2 th:text="${p.shopName}"></h2><p th:text="${p.phone}"></p><p th:text="${p.address}"></p><p th:text="${p.status}"></p><form th:if="${p.status == 'PENDING'}" th:action="@{/admin/applications/{id}(id=${p.id})}" method="post"><button name="approve" value="true">Approve</button><button class="btn-secondary" name="approve" value="false">Reject</button></form></article></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
