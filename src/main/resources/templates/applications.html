<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet your next sellers. | Pustok</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><header class="topbar"><a class="logo" href="/"><span class="logo-mark">p</span> pustok</a><nav aria-label="Account navigation"><a href="/">Discover</a><a sec:authorize="hasAnyRole('BUYER','SELLER')" href="/buyer/orders">My orders</a><a sec:authorize="hasRole('SELLER')" href="/seller/books">My books</a><a sec:authorize="hasRole('SELLER')" href="/seller/orders">Seller orders</a><a sec:authorize="hasRole('ADMIN')" href="/admin">Accounts</a><a sec:authorize="hasRole('ADMIN')" href="/admin/applications">Applications</a><a sec:authorize="hasRole('ADMIN')" href="/admin/categories">Categories</a><a sec:authorize="hasRole('ADMIN')" href="/admin/orders">Orders</a></nav><form th:action="@{/signout}" method="post"><button class="signout">Sign out</button></form></header><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">SELLER COMMUNITY</span><h1>Meet your next sellers.</h1><p>Review shop details and approve applications with confidence.</p></div><div class="workspace-content applications"><p class="empty-state" th:if="${#lists.isEmpty(profiles)}">No seller applications yet.</p><article th:each="p : ${profiles}"><h2 th:text="${p.shopName}"></h2><p th:text="${p.phone}"></p><p th:text="${p.address}"></p><p th:text="${p.status}"></p><form th:if="${p.status == 'PENDING'}" th:action="@{/admin/applications/{id}(id=${p.id})}" method="post"><button name="approve" value="true">Approve</button><button class="secondary-button" name="approve" value="false">Reject</button></form></article></div></main><footer><a class="logo" href="/">pustok</a><small>Made for the love of a good story.</small><small>2026 Pustok Books</small></footer></body></html>
