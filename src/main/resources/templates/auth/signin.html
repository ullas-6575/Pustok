<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><th:block th:replace="~{fragments/nav :: site-header(active='signin')}"></th:block><main class="card"><a class="brand" th:href="@{/}">Pustok</a><h1>Sign in</h1><p class="muted">Enter your email and password to continue.</p>
<p class="notice" role="status" th:if="${message}" th:text="${message}"></p><p class="notice" role="status" th:if="${param.logout}">You have signed out.</p>
<form th:action="@{/signin}" th:object="${form}" method="post">
<div class="notice error" role="alert" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
<label for="email">Email</label><input id="email" type="email" th:field="*{email}" autocomplete="email" required th:aria-invalid="${#fields.hasErrors('email')} ? 'true' : null" th:aria-describedby="${#fields.hasErrors('email')} ? 'email-error' : null"><small id="email-error" class="field-error" th:errors="*{email}"></small>
<label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required th:aria-invalid="${#fields.hasErrors('password')} ? 'true' : null" th:aria-describedby="${#fields.hasErrors('password')} ? 'password-error' : null"><small id="password-error" class="field-error" th:errors="*{password}"></small>
<button type="submit">Sign in</button></form><p class="foot">New to Pustok? <a th:href="@{/signup}">Create an account</a></p></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
