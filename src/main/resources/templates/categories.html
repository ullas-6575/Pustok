<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A place for every story. | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='categories')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">CURATE THE COLLECTION</span><h1>A place for every story.</h1><p>Organize your catalog into categories readers can explore.</p></div><div class="workspace-content categories"><form th:action="@{/admin/categories}" method="post"><label class="field-label">Category name<input name="name" required maxlength="100" placeholder="Category name"></label><button>Add category</button></form><article th:each="c : ${categories}"><form th:action="@{/admin/categories}" method="post"><input type="hidden" name="id" th:value="${c.id}"><label class="field-label">Category name<input name="name" th:value="${c.name}" required maxlength="100"></label><button>Save</button></form><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"><button class="btn-danger">Delete</button></form></article></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
