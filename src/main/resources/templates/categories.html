<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A place for every story. | Pustok</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><header class="topbar"><a class="logo" href="/"><span class="logo-mark">p</span> pustok</a><nav aria-label="Account navigation"><a href="/">Discover</a><a sec:authorize="hasAnyRole('BUYER','SELLER')" href="/buyer/orders">My orders</a><a sec:authorize="hasRole('SELLER')" href="/seller/books">My books</a><a sec:authorize="hasRole('SELLER')" href="/seller/orders">Seller orders</a><a sec:authorize="hasRole('ADMIN')" href="/admin">Accounts</a><a sec:authorize="hasRole('ADMIN')" href="/admin/applications">Applications</a><a sec:authorize="hasRole('ADMIN')" href="/admin/categories">Categories</a><a sec:authorize="hasRole('ADMIN')" href="/admin/orders">Orders</a></nav><form th:action="@{/signout}" method="post"><button class="signout">Sign out</button></form></header><main class="workspace-shell"><div class="workspace-heading"><span class="eyebrow">CURATE THE COLLECTION</span><h1>A place for every story.</h1><p>Organize your catalog into categories readers can explore.</p></div><div class="workspace-content categories"><form th:action="@{/admin/categories}" method="post"><label class="field-label">Category name<input name="name" required maxlength="100" placeholder="Category name"></label><button>Add category</button></form><article th:each="c : ${categories}"><form th:action="@{/admin/categories}" method="post"><input type="hidden" name="id" th:value="${c.id}"><label class="field-label">Category name<input name="name" th:value="${c.name}" required maxlength="100"></label><button>Save</button></form><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"><button class="danger-button">Delete</button></form></article></div></main><footer><a class="logo" href="/">pustok</a><small>Made for the love of a good story.</small><small>2026 Pustok Books</small></footer></body></html>
