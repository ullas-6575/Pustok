<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Pustok</title><link rel="stylesheet" href="/css/auth.css"></head><body><main style="background:white;padding:32px;width:min(1100px,100%)"><a href="/">Home</a> | <a href="/admin">Admin</a><h1>Categories</h1><form th:action="@{/admin/categories}" method="post"><input name="name" required maxlength="100" placeholder="Category name"><button>Add category</button></form><article th:each="c : ${categories}"><form th:action="@{/admin/categories}" method="post"><input type="hidden" name="id" th:value="${c.id}"><input name="name" th:value="${c.name}" required maxlength="100"><button>Save</button></form><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"><button>Delete</button></form></article></main></body></html>
