<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-page"><th:block th:replace="~{fragments/nav :: site-header(active='categories')}"></th:block><main class="workspace-shell"><div class="workspace-heading"><h1>Categories</h1><p>Add, rename and delete the categories shoppers browse by.</p></div><p class="notice" th:if="${message}" th:classappend="${error != null ? ' error' : ''}" th:attr="role=${error != null ? 'alert' : 'status'}" th:text="${message}"></p><div class="workspace-content categories"><h2>Add a category</h2><form th:action="@{/admin/categories}" method="post"><label class="field-label">Category name<input name="name" required maxlength="100" placeholder="Category name"></label><button>Add category</button></form><h2>Existing categories</h2><article th:each="c : ${categories}"><form th:action="@{/admin/categories}" method="post"><input type="hidden" name="id" th:value="${c.id}"><label class="field-label">Category name<input name="name" th:value="${c.name}" required maxlength="100"></label><button th:aria-label="${'Save category ' + c.name}">Save</button></form><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete this category? Categories that still contain books cannot be deleted.');"><button class="btn-danger" th:aria-label="${'Delete category ' + c.name}">Delete</button></form></article></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
