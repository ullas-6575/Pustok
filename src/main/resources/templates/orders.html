<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Pustok</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" href="/css/cart.css"><link rel="stylesheet" href="/css/checkout.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="cart-page"><th:block th:replace="~{fragments/nav :: site-header(active=${adminView == true ? 'adminorders' : 'orders'})}"></th:block><main class="cart-shell"><div class="cart-heading"><div><h1 th:text="${adminView ? 'Manage orders' : 'Your orders'}"></h1><p>Orders move from placed to processing, then shipped and delivered.</p></div></div><section class="empty-state" th:if="${#lists.isEmpty(orders)}"><h2>No orders here yet.</h2><a class="btn" href="/">Browse books</a></section><article class="order-list-card" th:each="o : ${orders}"><div><span class="eyebrow" th:text="${#temporals.format(o['created_at'].toLocalDateTime(), 'dd MMM yyyy, HH:mm')}"></span><h2><a th:href="${(adminView ? '/admin/orders/' : '/buyer/orders/') + o['id']}" th:text="${'Order ' + #strings.substring(o['id'].toString(),0,8)}"></a></h2><p th:text="${o['recipient_name']}"></p><small th:with="gw=${o['gateway']}" th:text="${gw == null or gw == 'COD' ? 'Cash on delivery' : (gw == 'MOCK' ? 'Test card' : (gw == 'BKASH' ? 'bKash' : (gw == 'NAGAD' ? 'Nagad' : gw)))}"></small></div><div><span class="status-badge" th:text="${o['status']}"></span><p><strong th:text="${'BDT ' + o['total']}"></strong></p><a class="text-link" th:href="${(adminView ? '/admin/orders/' : '/buyer/orders/') + o['id']}">View order</a></div></article><div class="order-pagination"><a th:if="${page > 0}" th:href="${(adminView ? '/admin/orders?page=' : '/buyer/orders?page=') + (page - 1)}">Previous</a><span th:text="${'Page ' + (page + 1)}"></span><a th:if="${#lists.size(orders) == 20}" th:href="${(adminView ? '/admin/orders?page=' : '/buyer/orders?page=') + (page + 1)}">Next</a></div></main><th:block th:replace="~{fragments/nav :: site-footer}"></th:block></body></html>
