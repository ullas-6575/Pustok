<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Pustok</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/cart.css"><link rel="stylesheet" href="/css/checkout.css"></head><body class="cart-page"><header class="topbar"><a class="logo" href="/"><span class="logo-mark">p</span> pustok</a><a class="back-link" th:href="${adminView ? '/admin' : '/buyer/cart'}" th:text="${adminView ? 'Admin dashboard' : 'Your cart'}"></a></header><main class="cart-shell"><div class="cart-heading"><div><span class="eyebrow">EVERY BOOK HAS A JOURNEY</span><h1 th:text="${adminView ? 'Manage orders.' : 'Your orders.'}"></h1><p>Placed &#8594; Processing &#8594; Shipped &#8594; Delivered</p></div></div><section class="empty-cart" th:if="${#lists.isEmpty(orders)}"><h2>No orders here yet.</h2><a href="/">Discover books</a></section><article class="order-list-card" th:each="o : ${orders}"><div><span class="eyebrow" th:text="${o['created_at']}"></span><h2><a th:href="${(adminView ? '/admin/orders/' : '/buyer/orders/') + o['id']}" th:text="${'Order ' + #strings.substring(o['id'].toString(),0,8)}"></a></h2><p th:text="${o['recipient_name']}"></p><small>Cash on Delivery</small></div><div><span class="status-badge" th:text="${o['status']}"></span><p><strong th:text="${'BDT ' + o['total']}"></strong></p><a class="back-link" th:href="${(adminView ? '/admin/orders/' : '/buyer/orders/') + o['id']}">View order &#8594;</a></div></article><div class="order-pagination"><a th:if="${page > 0}" th:href="${(adminView ? '/admin/orders?page=' : '/buyer/orders?page=') + (page - 1)}">Previous</a><span th:text="${'Page ' + (page + 1)}"></span><a th:if="${#lists.size(orders) == 20}" th:href="${(adminView ? '/admin/orders?page=' : '/buyer/orders?page=') + (page + 1)}">Next</a></div></main></body></html>
