spring.application.name=EPustok
server.port=${PORT:8081}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# A non-empty schema without Flyway history must fail loudly instead of being baselined and re-running V1.
spring.flyway.baseline-on-migrate=false

app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}
